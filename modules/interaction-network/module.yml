description: 把成对关系画成节点和边：先用 igraph 看静态布局和外观，再用 networkD3 做可拖拽的 HTML。preview 为 mtcars 高相关网络。
application: |-
  用 igraph 画静态互作网络，并用 networkD3 给出可缩放的交互式版本。

  - 展示基因/蛋白或样本相关边，比较布局与节点着色。
  - 作为该图类型的 R 代码与布局参考；确认前不作为论文结果。
scientificQuestion: 互作网络布局与节点着色如何读出？
