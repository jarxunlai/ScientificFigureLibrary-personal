title: 分组性状散点矩阵与相关网络
titleEn: Grouped trait matrix and network
description: 下三角按森林类型颜色和叶习性形状展示五个叶片性状的散点与拟合，右上方网络用红蓝区分负正相关、实虚线区分显著与不显著，并以线宽表达相关强度。
scientificQuestion: 叶片性状的分布模式与生理指标相关网络是否支持同一观察？
application: |-
  - 联合查看生态性状的观测分布和性状—生理指标关联。
  - 跨生态系统展示关系时，同时保留分组符号以识别组间混杂。
dataProfile: 合成示例输入；1个运行期输入表。leaf_traits.csv：95行×10列
