moduleId: dual-cohort-triangle-clustermap
title: 双队列三角相关性聚类热图
titleEn: Dual-cohort triangular clustermap
description: 在同一正方形中用两套调色板区分队列：上三角显示GEO示例，下三角显示in-house示例，对角线留白，顶部和底部绘制与共同排序严格对应的聚类树。
scientificQuestion: 两个队列中细胞状态之间的相关结构是否一致？
application: |-
  - 比较发现队列和验证队列的状态相关结构。
  - 检查相同细胞类型标签在不同样本集合中是否形成类似模块。
dataProfile: 合成示例输入；2个运行期输入表。cohort_GEO.csv：80行×23列；cohort_inhouse.csv：80行×23列
