title: 密度散点相关矩阵分箱版本
titleEn: Binned-density correlation matrix
description: 上三角用色块与数值展示Spearman相关，对角写变量名，下三角用二维分箱密度展示观测分布。保留彩虹和红色两套上三角配色，所有相关值由同一示例表计算。
scientificQuestion: 多个核小体扰动指标的相关强度与二维分布形状是否一致？
application: |-
  - 大规模多变量测量中，用密度避免散点覆盖。
  - 比较相似的整体相关值背后是否存在不同分布形状。
dataProfile: 合成示例输入；1个运行期输入表。nucleosome_features.csv：9000行×7列
