schema: figure-library.personal-module.v1
moduleId: grouped-jitter-volcano
title: 单细胞分组抖动火山图
titleEn: grouped jitter volcano
description: 把多细胞类型的 log2FC 画成 8 列抖动火山图。示例示例对同一张 DEG 表随机抽样拼出 8 组。
application: |-
  -已有按细胞类型分开的 DEG 表时，用分组抖动火山图并排比较各群的上下调幅度。
  -不适合经典 -log10(p) 火山图。
scientificQuestion: 八个细胞类型里，哪些基因的 log2FC 最强上调或下调？
dataProfile: data02.csv：基因×DEG 列。脚本随机抽 8×2000 行当作细胞类型。
