title: 核密度相关矩阵R版本
titleEn: KDE correlation matrix in R
description: 与第11项同一输入和同一Spearman矩阵；下三角改为二维高斯KDE，保留对角变量名、彩虹与红色上三角版本。
scientificQuestion: 多变量关联的方向与平滑二维密度如何一起查看？
application: |-
  - 展示连续型多指标数据的平滑共分布。
  - 比较不同密度估计时保持相关数值与输入不变，避免把平滑程度当成不同生物学结果。
dataProfile: 合成示例输入；1个运行期输入表。nucleosome_features.csv：9000行×7列
