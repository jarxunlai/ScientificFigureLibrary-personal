title: 微生物共现网络与Zi-Pi角色
titleEn: Co-occurrence networks and Zi-Pi roles
description: 两组合成OTU计数分别经过相对丰度与出现频率过滤、Spearman相关筛边、Fast Greedy模块划分，网络按门着色并区分相关正负；下方用Pi=0.62和Zi=2.5显示拓扑角色。保留GraphML、节点角色和网络指标。
scientificQuestion: OTU相关网络中哪些节点跨模块连接较多，哪些节点模块内连接较强？
application: |-
  - 基于明确阈值审阅微生物共现图及节点拓扑角色。
  - 将网络计算结果导出到Gephi继续布局，而不把正负相关解释为已证实的协作或竞争。
dataProfile: 合成示例输入；3个运行期输入表。otu_counts_G.csv：225行×33列；otu_counts_T.csv：175行×29列
