schema: figure-library.personal-module.v1
moduleId: tf-motif-enrichment-heatmap
title: 转录因子基序富集注释热图
titleEn: Annotated TF motif enrichment heatmap
description: 以稀疏方格热图展示基因趋势组与 TF motif 的对应模式，将行侧轨迹和趋势注释、列侧转录因子家族色条与连续色标组合在同一视图中，便于比较组间模式及家族分布。
application: |-
  - 调控模式比较：用已有 motif 富集结果对照不同细胞轨迹或基因趋势组，观察共同和特异模式。
  - TF 家族概览：结合列侧家族注释，检查候选 motif 在不同分组中的分布与聚集情况。
scientificQuestion: 不同细胞轨迹或基因表达趋势组对应哪些 TF motif 富集模式，这些模式在转录因子家族之间如何分布？
dataProfile: 三张 CSV：18 行趋势组信息、39 行 motif 及家族信息、117 行方格数值记录。
