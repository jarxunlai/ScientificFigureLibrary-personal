schema: figure-library.personal-module.v1
moduleId: inverted-triangle-dendrogram
title: 倒三角相关热图与聚类树
titleEn: Inverted triangle and dendrogram
description: 将相关矩阵的上三角以菱形单元旋转为倒三角，顶部保留complete-linkage聚类树，两条斜边分别标注相同变量，并用类别色点提示所属分组。
scientificQuestion: 变量是否形成相近的共变模块，模块边界如何与分类对应？
application: |-
  - 展示共表达、代谢物或生理指标的模块化相关结构。
  - 用较紧凑的倒三角版式保留树与变量名称，供后续人工拼版。
dataProfile: 合成示例输入；2个运行期输入表。abundance.csv：90行×27列；groups.csv：26行×2列
