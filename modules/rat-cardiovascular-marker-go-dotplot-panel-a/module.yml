schema: figure-library.personal-module.v1
moduleId: rat-cardiovascular-marker-go-dotplot-panel-a
title: 大鼠心血管细胞marker点图与GO条形组合图
titleEn: Rat cardiovascular marker dotplot with aligned GO NES bars
description: 将细胞簇的标记基因点图、细胞类型注释和 GO 功能条形图逐组对齐，在同一视图中关联分子标记与功能特征。点大小和色深表达两个数值维度，右侧条形与文字便于对照各簇的功能模式。
application: |-
  - 单细胞图谱注释：并排查看候选 marker 的表达模式和对应功能特征，比较相邻细胞类型。
  - 细胞群功能概览：用分组点阵、细胞类型颜色与 GO 条形联动展示多组信息。
scientificQuestion: 细胞簇的标记基因表达模式与对应 GO 功能是否相互支持其细胞身份注释？
dataProfile: 三张输入表：26 行细胞簇标签与注释、3380 行 marker 点阵记录、78 行 GO 条形记录。
