description: >-
  独立 Local Published 条目：Paoli et al. Nature 2022 Fig.2b。包括当前 preview、canonical
  organized.R、histogram-observations.csv、gcf-distance-summary.csv、作者原始脚本、AUTHOR_LICENSE、说明/来源/schema/readme 和渲染证据。仅
  private_reference；不公开到 Community。


  适用场景：已完成 GCF 聚类和 reference-distance 计算，需要量化 dbar>0.2 的新颖 GCF、筛选新颖 BGC class 候选，或检查 novelty 是否集中于少数 phylum。作者 histogram
  的 GCF-category 计数口径和 unique GCF headline 分开记录。
application: 未单独记录。此历史模板尚未提供独立应用场景。
scientificQuestion: 相对于 RefSeq/BiG-FAM 和 MIBiG，海洋 GCF 的新颖性距离分布如何？新颖性由哪些 BGC class 和 phylum 贡献？
