application: |-
  - 可用于将多类二值证据按基因排列为环形轨道，外圈柱形展示汇总值，但需要先确认自己的数据结构和统计量定义与该编码一致。
  - 当前展示的是授权示例或包内数据；套用于新的研究时须核对输入含义、缺失处理及上游统计。
scientificQuestion: 将多类二值证据按基因排列为环形轨道，外圈柱形展示汇总值。
dataProfile: 156 行、8 列最小表；第七个二值轨道明确为演示轨道，不是真实文献证据。
