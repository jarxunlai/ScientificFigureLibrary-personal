schema: figure-library.personal-module.v1
moduleId: multiscale-correlation-heatmap
title: 一维二维多维相关性热图
titleEn: Multiscale correlation heatmaps
description: 保留文章的三类表达：按变量组着色的显著相关三角矩阵、细胞类型与NMF因子的双向聚类热图、环境相关矩阵与partial Mantel网络。三幅图分别保存，避免把不同统计对象混成一张相关图。
scientificQuestion: 单组变量、两类特征及群落与环境的关联分别如何展示？
application: |-
  - 用分组矩阵比较水质、地理和微生物指标。
  - 比较细胞类型与NMF因子，或用距离矩阵检验群落与环境的关联；具体解释仍受距离和置换设计约束。
dataProfile: 合成示例输入；7个运行期输入表。environment_variables.csv：75行×37列；environment_groups.csv：36行×2列
