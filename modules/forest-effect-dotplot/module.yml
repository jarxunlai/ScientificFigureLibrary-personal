title: 增温效应森林点距图
titleEn: forest effect dotplot
description: 按微生物类群展示增温效应大小、区间和显著性。效应值由脚本随机生成。
application: |-
  -已有各类群效应估计和区间时，用翻转点距图比较正负效应。
  -不适合真正的 meta-analysis 森林图。
scientificQuestion: 不同微生物类群对增温的效应是正还是负？
dataProfile: rownames.csv 提供 28 个类群名。
plotFamily: forest
