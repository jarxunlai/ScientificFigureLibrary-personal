schema: figure-library.personal-module.v1
moduleId: trait-correlation-matrix-trends
title: 水稻性状相关矩阵与年代趋势
titleEn: Rice trait matrix and year trends
description: 将四个性状的分布、两两关系和年代变化同时摆在一张图中。对角线是直方图与高斯曲线，下三角是散点和线性拟合，上三角给出由输入表实际计算的R平方与P值，右侧按性状展示年份趋势。
scientificQuestion: 多个品质性状如何相互关联，各性状是否随育成年份变化？
application: |-
  - 比较植物品种的品质性状，观察哪些性状的变化相互伴随。
  - 在育种或长期调查数据中，区分性状之间的相关与随时间的整体趋势。
dataProfile: 合成示例输入；1个运行期输入表。rice_traits.csv：170行×5列
