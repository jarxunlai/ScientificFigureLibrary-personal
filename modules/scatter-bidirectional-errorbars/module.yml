title: 双向误差棒散点图
titleEn: scatter bidirectional errorbars
description: 同时显示 x、y 方向标记分数区间。xmin/xmax/ymin/ymax 由 runif 模拟。
application: |-
  -已有成对代谢物标记分数及其 x/y 区间时，用双向误差棒散点看是否落在 y=x 附近。
  -不适合只有点估计没有区间。
scientificQuestion: 各观测的标记 aKG 与 glutamate 分数是否沿 y=x？
dataProfile: 40 行模拟。无外部表。
