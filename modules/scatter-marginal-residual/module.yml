schema: figure-library.personal-module.v1
moduleId: scatter-marginal-residual
title: 对数散点边缘直方图与残差箱线图
titleEn: Scatter, marginals and residuals
description: 主图以双对数坐标显示基因组大小与CDS数，按SAG、MAG、WGS着色并叠加log尺度线性拟合；上方和右侧是同源数据的边缘直方图，图内残差箱线图显示三组的拟合偏离。
scientificQuestion: 基因组长度与编码序列数的关系及其残差是否因数据类型不同而变化？
application: |-
  - 比较不同组装来源的基因组尺度关系。
  - 对两变量拟合后检查分组残差，而不把相关关系解释为因果。
dataProfile: 合成示例输入；1个运行期输入表。genomes.csv：1180行×3列
