schema: figure-library.personal-module.v1
moduleId: correlation-matrix-marginal-bars
title: 胆汁酸相关矩阵与边缘浓度条形图
titleEn: Bile acid correlations and marginal bars
description: 用上三角气泡矩阵表现胆汁酸的两两Pearson相关，颜色与点大小共同表达相关方向和强度；斜向变量名按胆汁酸类别着色，右侧浓度条形与矩阵行严格对齐，左侧小图显示五类总量之间的相关。
scientificQuestion: 胆汁酸之间是否呈现分组相关，变量平均丰度是否与相关模式一致？
application: |-
  - 检查代谢组中同类及跨类别代谢物的共变模式。
  - 同时查看高丰度代谢物与相关模块，避免只从相关强度猜测浓度。
dataProfile: 合成示例输入；1个运行期输入表。bile_acid_abundance.csv：90行×37列
