schema: figure-library.personal-module.v1
moduleId: ternary-state-density
title: 五类三元图与状态概率密度
titleEn: Ternary plots and state densities
description: 覆盖胚胎谱系、T细胞状态（年龄组与连续年龄两图）、微生物生态位、施肥条件属组成、两种肿瘤状态概率密度，共7幅。各输入前三个坐标均非负且和为1，密度图在二维投影后作KDE并掩去三角外区域。
scientificQuestion: 一个细胞、OTU或样本如何在三种相对状态或环境间分配？
application: |-
  - 展示三个归一化signature或概率之间的相对偏向。
  - 用气泡大小保留OTU丰度，或用密度表达大量对象的连续归属；不能从归一化比例推断绝对数量。
dataProfile: 合成示例输入；5个运行期输入表。embryo_lineages.csv：600行×4列；immune_states.csv：310行×5列
plotFamily: ternary_scatter_density
